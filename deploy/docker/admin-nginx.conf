# admin 静态站（SPA fallback）：所有非文件路由回退 index.html。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源缓存
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
