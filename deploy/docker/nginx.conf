# 前台反代（架构 §9.2）：/api/* → api；/admin/* → admin(静态)；其余 → storefront。
#
# 上游解析策略（真机问题 #28）：
#   静态 upstream 会在 nginx 启动时把 api/storefront 的容器 IP 解析一次并缓存；
#   容器重建（换 IP）后 nginx 仍指向旧 IP → 全站 502，且 nginx 自己毫无察觉。
#   改为「set 变量 + Docker 内嵌 DNS resolver」，每次请求按 valid=2s 的 TTL 重新解析，
#   容器换 IP 后自动跟随，无需 reload / restart nginx。
#   （valid 从 10s 收到 2s：容器重建换 IP 后旧 IP 最多再被缓存 2 秒，
#     原先 10s 会留一个 10 秒的 502 窗口。Docker 内嵌 DNS 是本机回环查询，无网络开销。）
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Docker 内嵌 DNS（127.0.0.11）在自定义 bridge 网络下同样可用
    # valid=2s：容器重建换 IP 后，旧 IP 最多再被缓存 2 秒（原先 10s 会留一个 10 秒的 502 窗口）。
    # Docker 内嵌 DNS 是本机回环查询，valid 调小不带来任何网络开销。
    resolver 127.0.0.11 valid=2s ipv6=off;

    set $api_upstream        api:3000;
    set $admin_upstream      admin:80;
    set $storefront_upstream storefront:3000;

    # 健康检查
    location = /healthz { return 200 "ok\n"; }

    # Let's Encrypt HTTP-01 校验目录。
    # 只在 certbot 续期时命中（/.well-known/acme-challenge/ 前缀最长匹配优先），
    # 其余流量走下面的 location，行为不变。
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # API 进程
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # XFF 用覆盖语义（$remote_addr）而不是追加（$proxy_add_x_forwarded_for）：
        # 追加会把客户端自带的 XFF 拼到链首。虽然后端限流的 keyGenerator 走信任链算法
        # 能防伪造，但彻底消除歧义更稳 —— nginx 是唯一入口，客户端 IP 就是 $remote_addr。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 管理后台（静态）：/admin/ 前缀需剥离（后台容器根路径即站点根）
    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass http://$admin_upstream;
        proxy_set_header Host $host;
    }

    # 店面（默认）
    location / {
        proxy_pass http://$storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 同 /api/：XFF 覆盖语义，见上面的说明
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# HTTPS 片段（setup-https.sh 生成到 ${MALL_DIR}/config/nginx/https.inc）。
# 放在最后：nginx 以「同一 listen 端口上第一个 server 块」作为默认站点，
# 保持在后面才能让上面的 server_name _ 继续当 80 端口的默认站点（用 IP 访问不受影响）。
# 未启用 HTTPS 时该目录为空，include 匹配不到文件，行为与纯 HTTP 完全一致。
include /etc/nginx/snippets/*.https.inc;
